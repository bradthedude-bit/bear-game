<script>
(function(){
'use strict';
// ---------- Low-res buffer ----------
const W = 160; let H = 288; let gameReady = false;
const screen = document.getElementById('screen');
const sctx = screen.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const g = buf.getContext('2d');
g.imageSmoothingEnabled = false;
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize(){
  dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 4));
  const cw = Math.floor(window.innerWidth * dpr), ch = Math.floor(window.innerHeight * dpr);
  screen.width = cw; screen.height = ch;
  screen.style.width = window.innerWidth + 'px'; screen.style.height = window.innerHeight + 'px';
  // stretch the low-res buffer height to fill the phone's aspect ratio (crisp, no letterbox)
  const nh = Math.max(256, Math.min(352, Math.round(W * ch / cw)));
  if (nh !== H){ H = nh; buf.height = H; g.imageSmoothingEnabled = false; if (gameReady) PLAYER_Y = H - 68; }
  let s = Math.min(cw / W, ch / H);
  if (s >= 3) s = Math.floor(s);           // integer scaling = perfectly even pixels
  scale = s;
  offX = Math.floor((cw - W * s) / 2); offY = Math.floor((ch - H * s) / 2);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

// ---------- Palette (NES-ish) ----------

  white:'#fcfcfc', black:'#000000', gold:'#f8b800', red:'#d82800', sky:'#3cbcfc', dark:'#001a36', grey:'#7c7c7c'
};

// ---------- Sprites (hand-defined pixel arrays) ----------
const SPR = {

    "...WWWW...",

    "..WWRRWW..",
    "...KWWK...",
    ".NNNNNNNN.",

    ".NNNNNNNN.",
    "NWWNNNNWWN",
    "SNNNWWNNNB",

    "......KK.."],
  defA: [
    "..KK......",
    "..ww..ww..",
    "..wwwwww..",
    ".rrrrrrrr.",
    "SrrrrrrrrS",
    "SrrwwwwrrS",
    "SrrrwwrrrS",
    "SrrrwwrrrS",
    "rrrrrrrrrr",
    ".rrrrrrrr.",
    "...KDDK...",
    "..DDyyDD..",
    "..DDyyDD..",
    "...DDDD..."],
  defB: [
    "......KK..",
    "..ww..ww..",
    "..wwwwww..",
    ".rrrrrrrr.",
    "SrrrrrrrrS",
    "SrrwwwwrrS",
    "SrrrwwrrrS",

    "rrrrrrrrrr",
    ".rrrrrrrr.",
    "...KDDK...",
    "..DDyyDD..",
    "..DDyyDD..",
    "...DDDD..."],
  ball: [
    "..BBBB..",
    ".BWBWBB.",
    "BBWWWWBB",
    ".BWBWBB.",
    "..BBBB.."],
  speaker: [
    "...K.....",
    "..KK.....",
    "KKKK.....",
    "KKKK.....",
    "KKKK.....",

    "...K....."],
  paw: [
    ".N.N.N.",
    ".N.N.N.",
    ".......",
    "..NNN..",
    ".NNNNN.",
    ".NNNNN.",
    "..N.N.."]
};
function makeSprite(rows, pal, flipX){
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let j=0;j<h;j++) for (let i=0;i<w;i++){
    const ch = rows[j][flipX ? w-1-i : i];
    const col = pal[ch];
    if (ch !== '.' && col){ x.fillStyle = col; x.fillRect(i,j,1,1); }
  }
  return c;
}
const palTracker = Object.assign({}, PAL, { r:'#a80020', D:'#f8b800', y:'#d82800' });
const palGhost = {}; for (const k in PAL) palGhost[k] = '#3cbcfc';
const palWhite = {}; for (const k in PAL) palWhite[k] = '#fcfcfc';
const S = {
  pA: makeSprite(SPR.playerA, PAL), pB: makeSprite(SPR.playerB, PAL),
  pAf: makeSprite(SPR.playerA, PAL, true), pBf: makeSprite(SPR.playerB, PAL, true),
  pGhost: makeSprite(SPR.playerA, palGhost), pWhite: makeSprite(SPR.playerA, palWhite),
  dA: makeSprite(SPR.defA, PAL), dB: makeSprite(SPR.defB, PAL),
  tA: makeSprite(SPR.defA, palTracker), tB: makeSprite(SPR.defB, palTracker),
  ball: makeSprite(SPR.ball, PAL),
  spk: makeSprite(SPR.speaker, {K:'#fcfcfc'}),
  paw: makeSprite(SPR.paw, {N:'#fcfcfc'}), pawNavy: makeSprite(SPR.paw, PAL)
};

// ---------- 3x5 bitmap font ----------
const FONT = {
  A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],
  H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[6,5,5,5,5],
  O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],
  V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
  '0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[6,1,2,4,7],'3':[6,1,2,1,6],'4':[5,5,7,1,1],'5':[7,4,6,1,6],
  '6':[3,4,7,5,7],'7':[7,1,1,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,6],
  ' ':[0,0,0,0,0],':':[0,2,0,2,0],'!':[2,2,2,0,2],'-':[0,0,7,0,0],'.':[0,0,0,0,2],'+':[0,2,7,2,0],
  '/':[1,1,2,4,4],"'":[2,2,0,0,0],'?':[6,1,2,0,2],',':[0,0,0,2,4],'&':[2,5,2,5,3],'=':[0,7,0,7,0],
  '<':[1,2,4,2,1],'>':[4,2,1,2,4]
};
function textWidth(str, s){ return str.length * 4 * s - s; }
function drawText(str, x, y, col, s, align, shadow){
  s = s || 1; str = String(str).toUpperCase();
  let w = textWidth(str, s);
  if (align === 'center') x = Math.round(x - w/2); else if (align === 'right') x = Math.round(x - w);
  if (shadow){ const o = Math.max(1, Math.round(s / 3)); drawText(str, x + o, y + o, shadow, s, 'left'); }
  g.fillStyle = col;
  for (let n=0;n<str.length;n++){
    const gl = FONT[str[n]] || FONT['?'];
    for (let r=0;r<5;r++){ const bits = gl[r];
      for (let c=0;c<3;c++) if (bits & (4>>c)) g.fillRect(x + n*4*s + c*s, y + r*s, s, s);
    }
  }
}

// ---------- Chiptune audio ----------
let actx = null;
// soundMode: 0 = music + sfx, 1 = sfx only (music off), 2 = all muted
let soundMode = 0;
try { const v = localStorage.getItem('bear_sound'); soundMode = v !== null ? (parseInt(v, 10) || 0) % 3 : (localStorage.getItem('bear_muted') === '1' ? 2 : 0); } catch(e){}
function sfxOn(){ return soundMode < 2; }
function musicOn(){ return soundMode === 0; }
let audioUnlocked = false;
function initAudio(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; } }
  if (!actx) return;
  if (actx.state !== 'running') { try { actx.resume(); } catch(e){} }
  if (!audioUnlocked){
    // iOS Safari: play a 1-sample silent buffer inside the user gesture to unlock audio output
    try { const b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0); audioUnlocked = true; } catch(e){}
  }
  syncMusic();
}
['touchstart','touchend','pointerdown','pointerup','click','keydown'].forEach(ev =>
  window.addEventListener(ev, initAudio, { capture: true, passive: true }));
// pause all audio (music clock included) while the tab is hidden; resume where it left off
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  try { if (document.hidden) actx.suspend(); else actx.resume(); } catch(e){}
});
window.addEventListener('pagehide', () => { try { actx && actx.suspend(); } catch(e){} });

// <music> ---------- Original chiptune fight-song march ("Blue & White March", composed for BEAR) ----------
// Self-contained: depends only on an AudioContext passed in, so it can also be rendered offline.
const BearMusic = (function(){
  const PC = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
  function midi(n){ const m = /^([A-G][#b]?)(-?\d)$/.exec(n); if (!m) throw new Error('bad note ' + n); return 12 * (+m[2] + 1) + PC[m[1]]; }
  function hz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function near(pc, lo){ let m = lo; while (((m % 12) + 12) % 12 !== pc) m++; return m; }
  const CHORDS = { Bb:['Bb','D','F'], Eb:['Eb','G','Bb'], F:['F','A','C'], Gm:['G','Bb','D'], C7:['C','E','Bb'],
                   G7:['G','B','F'], Cm:['C','Eb','G'], F7:['F','A','Eb'], Ab:['Ab','C','Eb'] };
  // Melodies: tokens NOTE:eighths ('r' = rest), bars split by '|', every bar = 8 eighths (4/4).
  const TRACKS = {
    game: { bpm: 152, harm: 'mix', crashBars: [0, 8],
      mel:
        'F4:1 Bb4:1 D5:2 Bb4:1 D5:1 F5:2 | G5:2 F5:1 D5:1 Bb4:4 | Eb5:1 Eb5:1 G5:2 Eb5:1 G5:1 Bb5:2 | A5:2 G5:1 F5:1 D5:4 |' +
        'F5:1 F5:1 D5:1 Bb4:1 C5:1 D5:1 Eb5:1 F5:1 | G5:3 F5:1 Eb5:2 D5:2 | D5:1 Eb5:1 G5:2 E5:1 F5:1 G5:2 | A5:2 F5:2 C5:2 r:2 |' +
        'G5:3 Eb5:1 Bb4:2 Eb5:2 | G5:1 Bb5:1 Eb6:2 D6:1 C6:1 Bb5:2 | F5:3 D5:1 Bb4:2 D5:2 | B4:1 D5:1 F5:1 G5:1 B5:2 G5:2 |' +
        'C6:2 Bb5:1 G5:1 Eb5:2 C5:2 | A4:1 C5:1 Eb5:1 F5:1 A5:2 C6:2 | Bb5:2 F5:1 D5:1 Bb4:2 D5:1 F5:1 | Bb5:4 r:2 F4:1 A4:1',
      chords: [['Bb'],['Bb'],['Eb'],['Bb'],['Bb'],['F'],['Gm','C7'],['F'],
               ['Eb'],['Eb'],['Bb'],['G7'],['Cm'],['F7'],['Bb'],['Bb','F7']] },
    title: { bpm: 138, harm: 'hold', crashBars: [0, 4],
      mel:
        'Bb4:1 Bb4:1 Bb4:1 D5:1 F5:4 | Eb5:1 Eb5:1 Eb5:1 G5:1 Bb5:4 | A5:1 G5:1 F5:1 Eb5:1 D5:2 C5:2 | C5:2 D5:1 Eb5:1 F5:4 |' +
        'Bb4:1 Bb4:1 Bb4:1 D5:1 F5:4 | Ab5:1 Ab5:1 Ab5:1 G5:1 Eb5:4 | F5:2 D5:1 Eb5:1 C5:2 A4:2 | Bb4:4 r:2 F4:2',
      chords: [['Bb'],['Eb'],['F'],['F7'],['Bb'],['Ab'],['F7'],['Bb','F7']] }
  };
  const SNARE = { norm: 'X..xX.x.X..xX.xx', fill: 'X..xX.x.xxxxXXXX', title: 'X.......X..x.x..', tfill: 'X.......xxxxXXXX' };
  const KICK = 'X.......X.....x.';

  function compile(name){
    const T = TRACKS[name], bars = T.mel.split('|').map(s => s.trim().split(/\s+/));
    if (bars.length !== T.chords.length) throw new Error(name + ': bar/chord count mismatch');
    const nSteps = bars.length * 16, ev = Array.from({ length: nSteps }, () => []);
    bars.forEach((bar, bi) => {
      let pos = 0;
      for (const tok of bar){
        const [n, d] = tok.split(':'); const len = +d * 2;
        if (n !== 'r') ev[bi*16 + pos].push(['lead', midi(n), len]);
        pos += len;
      }
      if (pos !== 16) throw new Error(name + ' bar ' + (bi+1) + ' has ' + pos/2 + ' eighths');
      const ch = T.chords[bi];
      for (let beat = 0; beat < 4; beat++){
        const c = CHORDS[ch[ch.length === 2 && beat >= 2 ? 1 : 0]];
        // triangle bass: oom on root / fifth, quarter notes
        const bassPc = PC[c[beat % 2 === 0 ? 0 : 2]];
        ev[bi*16 + beat*4].push(['bass', near(bassPc, 39), 3]);
        // second pulse: offbeat "pah" stabs in A-section, sustained countermelody (3rds) otherwise
        const third = near(PC[c[1]], 62), fifth = near(PC[c[2]], 62);
        const holdBar = T.harm === 'hold' || (T.harm === 'mix' && bi >= 8);
        if (holdBar){ if (beat % 2 === 0) ev[bi*16 + beat*4].push(['harm', beat === 0 ? third : fifth, 7]); }
        else ev[bi*16 + beat*4 + 2].push(['harm', beat % 2 ? fifth : third, 1.5], ['harm2', beat % 2 ? third : fifth, 1.5]);
      }
      const fill = bi % 4 === 3;
      const sp = name === 'title' ? (fill ? SNARE.tfill : SNARE.title) : (fill ? SNARE.fill : SNARE.norm);
      for (let s = 0; s < 16; s++){
        if (sp[s] !== '.') ev[bi*16 + s].push(['snare', sp[s] === 'X' ? 1 : 0.45]);
        if (KICK[s] !== '.') ev[bi*16 + s].push(['kick', KICK[s] === 'X' ? 1 : 0.6]);
        if (name === 'game' && s % 2 === 0 && sp[s] === '.') ev[bi*16 + s].push(['hat', 1]);
      }
      if (T.crashBars.includes(bi)) ev[bi*16].push(['crash', 1]);
    });
    return { name, bpm: T.bpm, stepDur: 60 / T.bpm / 4, ev, nSteps };
  }
  const SONGS = { game: compile('game'), title: compile('title') };

  const waveCache = new WeakMap();
  function pulse(ctx, duty){
    let m = waveCache.get(ctx); if (!m){ m = {}; waveCache.set(ctx, m); }
    if (!m[duty]){ const N = 32, re = new Float32Array(N), im = new Float32Array(N);
      for (let n = 1; n < N; n++) re[n] = 2 * Math.sin(Math.PI * n * duty) / (Math.PI * n);
      m[duty] = ctx.createPeriodicWave(re, im); }
    return m[duty];
  }
  const noiseCache = new WeakMap();
  function noiseBuf(ctx){
    let b = noiseCache.get(ctx); if (b) return b;
    const len = ctx.sampleRate; b = ctx.createBuffer(1, len, ctx.sampleRate); const d = b.getChannelData(0);
    let v = 0; for (let i = 0; i < len; i++){ if (i % 4 === 0) v = Math.random() * 2 - 1; d[i] = v; }
    noiseCache.set(ctx, b); return b;
  }
  function osc(ctx, dest, t, f, dur, wave, vol, opts){
    opts = opts || {};
    const o = ctx.createOscillator(), g = ctx.createGain();
    if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
    o.frequency.setValueAtTime(f, t);
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur);
    if (opts.vib){ const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 6; lg.gain.value = f * 0.025;
      l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.05); }
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.linearRampToValueAtTime(vol * (opts.sus || 0.7), t + Math.min(0.08, dur * 0.5));
    g.gain.setValueAtTime(vol * (opts.sus || 0.7), t + dur * 0.9);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
  }
  function hit(ctx, dest, t, dur, vol, type, freq){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf(ctx);
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function playStep(ctx, dest, song, step, t){
    const sd = song.stepDur;
    for (const e of song.ev[step]){
      switch (e[0]){
        case 'lead':  osc(ctx, dest, t, hz(e[1]), e[2] * sd * 0.88, 'square', 0.085, { sus: 0.75 }); break;
        case 'harm':  osc(ctx, dest, t, hz(e[1]), e[2] * sd * 0.9, pulse(ctx, 0.25), 0.05, { sus: 0.6 }); break;
        case 'harm2': osc(ctx, dest, t, hz(e[1]), e[2] * sd * 0.9, pulse(ctx, 0.125), 0.03, { sus: 0.6 }); break;
        case 'bass':  osc(ctx, dest, t, hz(e[1]), e[2] * sd * 0.95, 'triangle', 0.2, { sus: 0.9 }); break;
        case 'kick':  osc(ctx, dest, t, 140, 0.11, 'triangle', 0.25 * e[1], { slide: 45, sus: 0.6 }); break;

// ---------- Music sequencer (lookahead scheduling on the AudioContext clock) ----------
const MUSIC_VOL = 0.45, LOOKAHEAD = 0.15, TICK_MS = 25;
const mus = { want: 'title', playing: null, song: null, step: 0, next: 0, bus: null, timer: null };
function newBus(){
  const b = actx.createGain(); b.gain.value = MUSIC_VOL; b.connect(actx.destination); return b;
}
function fadeOutBus(){
  if (!mus.bus) return; const b = mus.bus, t = actx.currentTime;
  b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value, t); b.gain.linearRampToValueAtTime(0, t + 0.08);
  setTimeout(() => { try { b.disconnect(); } catch(e){} }, 400);
  mus.bus = null;
}
function musicTick(){
  if (!actx || !mus.song || actx.state !== 'running') return;
  const now = actx.currentTime;
  if (mus.next < now - 0.25) mus.next = now + 0.05;            // fell far behind (e.g. long stall): resync, don't burst
  while (mus.next < now + LOOKAHEAD){
    BearMusic.playStep(actx, mus.bus, mus.song, mus.step, mus.next);
    mus.next += mus.song.stepDur;
    mus.step = (mus.step + 1) % mus.song.nSteps;
  }
}
function startSong(name, delay){
  fadeOutBus();
  mus.playing = name; mus.song = BearMusic.SONGS[name]; mus.step = 0;
  mus.bus = newBus(); mus.next = actx.currentTime + (delay || 0.05);
  if (!mus.timer) mus.timer = setInterval(musicTick, TICK_MS);
  musicTick();
}
function stopSong(){ fadeOutBus(); mus.playing = null; mus.song = null; }
// want = 'title' | 'game' | null ; syncMusic makes reality match want + soundMode
function setMusic(want, delay){ mus.want = want; syncMusic(delay); }
function syncMusic(delay){
  if (!actx || !audioUnlocked) return;
  const target = musicOn() ? mus.want : null;
  if (target === mus.playing) return;
  if (target) startSong(target, delay); else stopSong();
}
function duckMusic(secs){
  if (!mus.bus) return; const p = mus.bus.gain, t = actx.currentTime;
  p.cancelScheduledValues(t); p.setValueAtTime(p.value, t);
  p.linearRampToValueAtTime(MUSIC_VOL * 0.15, t + 0.05);
  p.setValueAtTime(MUSIC_VOL * 0.15, t + secs); p.linearRampToValueAtTime(MUSIC_VOL, t + secs + 0.4);
}
function playSadTag(){
  setMusic(null);
  if (!actx || !musicOn()) { SFX.over(); return; }
  const b = newBus(); const d = BearMusic.sadTag(actx, b, actx.currentTime + 0.05);
  setTimeout(() => { try { b.disconnect(); } catch(e){} }, (d + 1) * 1000);
}

function tone(freq, dur, type, vol, when, slideTo){
  if (!actx || !sfxOn()) return;
  const t0 = actx.currentTime + (when || 0);
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gn.gain.setValueAtTime(vol || 0.08, t0);
  gn.gain.setValueAtTime(vol || 0.08, t0 + dur * 0.7);
  gn.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  o.connect(gn); gn.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol, when){
  if (!actx || !sfxOn()) return;
  const t0 = actx.currentTime + (when || 0);
  const len = Math.floor(actx.sampleRate * dur);
  const b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  // chunky 'NES' noise: sample-and-hold random values
  let v = 0; for (let i=0;i<len;i++){ if (i % 6 === 0) v = Math.random()*2-1; d[i] = v * (1 - i/len); }
  const s = actx.createBufferSource(); s.buffer = b;
  const gn = actx.createGain(); gn.gain.value = vol || 0.15;
  s.connect(gn); gn.connect(actx.destination); s.start(t0);
}
const SFX = {
  whistle(){ for (let i=0;i<10;i++) tone(i%2 ? 2350 : 2100, 0.035, 'square', 0.04, i*0.035); },
  juke(){ tone(300, 0.12, 'square', 0.06, 0, 1200); },
  pickup(){ tone(988, 0.06, 'square', 0.06); tone(1319, 0.1, 'square', 0.06, 0.06); },
  td(){ const n=[523,659,784,1047,784,1047]; n.forEach((f,i)=>{ tone(f, 0.11, 'square', 0.06, i*0.1); tone(f/2, 0.11, 'triangle', 0.12, i*0.1); });
        tone(1047, 0.35, 'square', 0.06, 0.6); tone(523, 0.35, 'triangle', 0.12, 0.6); },
  tackle(){ noise(0.3, 0.25); tone(220, 0.3, 'square', 0.08, 0, 40); tone(110, 0.4, 'triangle', 0.15, 0.05, 30); },
  click(){ tone(660, 0.05, 'square', 0.05); },
  over(){ [392,349,311,262].forEach((f,i)=>tone(f, 0.16, 'triangle', 0.14, 0.45 + i*0.16)); }
};

// ---------- Game state ----------
const PXY = 6;              // pixels per yard
let PLAYER_Y = H - 68;       // player's fixed screen row
let state = 'title';        // title | play | tackled | over
let best = 0; try { best = parseInt(localStorage.getItem('bear_best') || '0', 10) || 0; } catch(e){}
let newBest = false;
let player, defenders, balls, particles, popups;
let dist, speed, elapsed, spawnT, ballT, bonus, tds, lastTDYard, shake, flash, tdText, tackleT, boost, overT, titleScroll = 0;

function reset(){
  player = { x: W/2 - 5, tx: W/2 - 5, jukeT: 0, jukeCD: 0, anim: 0, flip: false, grace: 0 };
  defenders = []; balls = []; particles = []; popups = [];
  dist = 0; speed = 62; elapsed = 0; spawnT = 1.2; ballT = 2.5; bonus = 0; tds = 0; lastTDYard = 0;
  shake = 0; flash = 0; tdText = 0; tackleT = 0; boost = 0; overT = 0; newBest = false;
}
gameReady = true; PLAYER_Y = H - 68;
reset();

function yards(){ return Math.floor(dist / PXY); }
function score(){ return yards() * 10 + bonus; }

function startGame(){ initAudio(); reset(); state = 'play'; SFX.whistle(); setMusic('game', 0.45); }

function burst(x, y, n, cols, spd){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (0.3 + Math.random()) * (spd || 70);
    particles.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 30, life: 0.6 + Math.random()*0.6,
      t: 0, col: cols[(Math.random()*cols.length)|0], sz: Math.random() < 0.5 ? 2 : 1 });
  }
}
function popup(txt, x, y, col){ popups.push({ txt, x, y, col, t: 0 }); }

function spawnDefender(){
  const lvl = Math.min(1, elapsed / 90);
  const tracker = Math.random() < 0.18 + lvl * 0.4;
  defenders.push({
    x: 8 + Math.random() * (W - 26), y: -16, w: 10, h: 14,
    vy: 12 + Math.random() * (20 + lvl * 50),
    vx: tracker ? 0 : (Math.random() < 0.3 ? (Math.random() - 0.5) * 30 : 0),
    tracker, turn: 22 + lvl * 40 + Math.random()*15, passed: false, anim: Math.random()*10
  });
}

// ---------- Input ----------
const keys = {};
let ptr = null;
function toBuf(cx, cy){ return { x: (cx * dpr - offX) / scale, y: (cy * dpr - offY) / scale }; }
function inMute(p){ return p.x >= W - 28 && p.y <= 16; }
const BTN = { x: 30, y: 196, w: 100, h: 26 };
function MY(){ return Math.floor((H - 288) / 2); }
function inBtn(p){ const by = BTN.y + MY(); return p.x >= BTN.x - 6 && p.x <= BTN.x + BTN.w + 6 && p.y >= by - 6 && p.y <= by + BTN.h + 6; }
let soundToast = 0;
function toggleMute(){
  soundMode = (soundMode + 1) % 3; soundToast = 1.2;
  try { localStorage.setItem('bear_sound', String(soundMode)); } catch(e){}
  initAudio(); syncMusic(); if (sfxOn()) SFX.click();
}
function juke(){
  if (state !== 'play' || player.jukeCD > 0) return;
  player.jukeT = 0.45; player.jukeCD = 1.3; SFX.juke();
  burst(player.x + 5, PLAYER_Y + 10, 8, [C.white, C.sky], 40);
}
screen.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const p = toBuf(e.clientX, e.clientY);
  if (inMute(p)){ toggleMute(); return; }
  if (state === 'title' || (state === 'over' && overT > 0.6)){ if (inBtn(p)) startGame(); return; }  // taps elsewhere just unlock audio / start the title music
  ptr = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, t: performance.now(), moved: false };
  try { screen.setPointerCapture(e.pointerId); } catch(_){}
}, { passive: false });
screen.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  e.preventDefault();
  const dx = (e.clientX - ptr.lx) * dpr / scale;
  ptr.lx = e.clientX;
  if (Math.abs(e.clientX - ptr.sx) > 8 || Math.abs(e.clientY - ptr.sy) > 8) ptr.moved = true;
  if (state === 'play') player.tx += dx * 1.25;
}, { passive: false });
function endPtr(e){
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.moved && performance.now() - ptr.t < 300) juke();
  ptr = null;
}
screen.addEventListener('pointerup', endPtr);
screen.addEventListener('pointercancel', e => { ptr = null; });
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev =>
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));
window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
  keys[k.toLowerCase()] = true;
  if (e.repeat) return;
  initAudio();
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if (state === 'title' && (k === 'Enter' || k === ' ')) startGame();
  else if (state === 'over' && overT > 0.6 && (k === 'Enter' || k === ' ')) startGame();
  else if (state === 'play' && (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W')) juke();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- Update ----------
function update(dt){
  titleScroll += dt * 30; soundToast = Math.max(0, soundToast - dt);
  for (const p of particles){ p.t += dt; p.vy += 160 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.t < p.life);
  for (const p of popups){ p.t += dt; p.y -= 18 * dt; }
  popups = popups.filter(p => p.t < 0.9);
  shake = Math.max(0, shake - dt * 18);
  flash = Math.max(0, flash - dt);
  tdText = Math.max(0, tdText - dt);

  if (state === 'tackled'){
    tackleT += dt;
    if (tackleT > 0.9){ state = 'over'; overT = 0; playSadTag(); }
    return;
  }
  if (state === 'over'){ overT += dt; if (overT > 2.6 && mus.want === null) setMusic('title'); return; }
  if (state !== 'play') return;

  elapsed += dt;
  speed = Math.min(170, 62 + elapsed * 1.6);
  const boostAmt = boost > 0 ? speed * 0.9 : 0;
  boost = Math.max(0, boost - dt);
  const scroll = (speed + boostAmt) * dt;
  const prevY = yards();
  dist += scroll;

  // touchdown every 100 yards
  const y = yards();
  if (Math.floor(y / 100) > Math.floor(prevY / 100)){
    tds++; bonus += 700; flash = 0.5; tdText = 1.6; shake = 3; player.grace = 1.2;
    SFX.td(); duckMusic(1.0);
    burst(player.x + 5, PLAYER_Y, 40, [C.white, C.royal, C.navy, C.gold, C.sky], 110);
    burst(W/2, 60, 30, [C.white, C.royal, C.gold], 90);
    popup('+700', player.x + 5, PLAYER_Y - 12, C.gold);
    // clear nearby rushers in celebration
    for (const d of defenders) if (d.y > PLAYER_Y - 60) { burst(d.x + 5, d.y + 7, 6, [C.red, C.white], 50); d.dead = true; }
  }

  // player movement
  const kdir = (keys['arrowleft'] || keys['a'] ? -1 : 0) + (keys['arrowright'] || keys['d'] ? 1 : 0);
  player.tx += kdir * 120 * dt;
  player.tx = Math.max(6, Math.min(W - 16, player.tx));
  const old = player.x;
  player.x += (player.tx - player.x) * Math.min(1, dt * 16);
  if (player.x - old < -0.2) player.flip = true; else if (player.x - old > 0.2) player.flip = false;
  player.anim += scroll;
  player.jukeT = Math.max(0, player.jukeT - dt);
  player.jukeCD = Math.max(0, player.jukeCD - dt);
  player.grace = Math.max(0, player.grace - dt);

  // spawns
  const lvl = Math.min(1, elapsed / 90);
  spawnT -= dt;
  if (spawnT <= 0 && player.grace <= 0){
    spawnDefender();
    if (Math.random() < lvl * 0.5) spawnDefender();
    spawnT = Math.max(0.32, 1.15 - elapsed * 0.012) * (0.7 + Math.random() * 0.6);
  }
  ballT -= dt;
  if (ballT <= 0){ balls.push({ x: 10 + Math.random() * (W - 28), y: -8, t: 0 }); ballT = 2 + Math.random() * 2.5; }

  // defenders
  for (const d of defenders){
    d.anim += dt * 10;
    d.y += scroll + d.vy * dt;
    if (d.tracker && d.y < PLAYER_Y + 4){
      const dx = (player.x) - d.x;
      d.vx += Math.sign(dx) * d.turn * 3 * dt;
      d.vx = Math.max(-d.turn, Math.min(d.turn, d.vx));
    }
    d.x += d.vx * dt;
    if (d.x < 6){ d.x = 6; d.vx = Math.abs(d.vx); }
    if (d.x > W - 16){ d.x = W - 16; d.vx = -Math.abs(d.vx); }
    // collision
    if (!d.passed && !d.dead){
      const hit = player.x + 2 < d.x + d.w - 2 && player.x + 8 > d.x + 2 && PLAYER_Y + 2 < d.y + d.h - 2 && PLAYER_Y + 12 > d.y + 3;
      if (hit){
        if (player.jukeT > 0 || player.grace > 0){
          d.passed = true;
          if (player.jukeT > 0){ player.jukeT = Math.min(player.jukeT, 0.12); bonus += 100; popup('JUKE +100', d.x + 5, d.y - 4, C.sky); tone(1568, 0.08, 'square', 0.05); }
        } else {
          state = 'tackled'; tackleT = 0; shake = 7; SFX.tackle(); setMusic(null);
          burst(player.x + 5, PLAYER_Y + 6, 26, [C.white, C.navy, C.red, C.gold, '#c8804c'], 90);
          const sc = score();
          if (sc > best){ best = sc; newBest = true; try { localStorage.setItem('bear_best', String(best)); } catch(e){} }
          return;
        }
      }
    }
  }
  defenders = defenders.filter(d => d.y < H + 20 && !d.dead);

  // balls
  for (const b of balls){
    b.t += dt; b.y += scroll;
    if (!b.got && player.x < b.x + 8 && player.x + 10 > b.x && PLAYER_Y < b.y + 5 && PLAYER_Y + 14 > b.y){
      b.got = true; bonus += 50; boost = 0.5; SFX.pickup();
      burst(b.x + 4, b.y + 2, 10, [C.gold, C.white, '#7c3c00'], 60);
      popup('+50 BURST', b.x + 4, b.y - 6, C.gold);
    }
  }
  balls = balls.filter(b => b.y < H + 10 && !b.got);
}

// ---------- Render ----------
function drawField(d){
  // d = distance in px; world position p shows at screen y = PLAYER_Y - (p - d)
  const topP = d + PLAYER_Y, botP = d + PLAYER_Y - H;
  // grass stripes every 5 yards
  const stripe = 5 * PXY;
  for (let k = Math.floor(botP / stripe) - 1; k * stripe <= topP + stripe; k++){
    const y0 = Math.round(PLAYER_Y - ((k + 1) * stripe - d));
    g.fillStyle = (k & 1) ? C.grass1 : C.grass2;
    g.fillRect(0, y0, W, stripe);
  }
  // yard lines
  for (let k = Math.floor(botP / stripe) - 1; k * stripe <= topP + stripe; k++){
    const y0 = Math.round(PLAYER_Y - (k * stripe - d));
    const yd = ((k * 5) % 100 + 100) % 100;
    if (yd === 0) continue;
    g.fillStyle = C.line; g.fillRect(6, y0, W - 12, 1);
    if (yd % 10 === 0){
      const num = String(yd <= 50 ? yd : 100 - yd);
      drawText(num, 16, y0 - 7, C.line, 1, 'left');
      drawText(num, W - 16, y0 - 7, C.line, 1, 'right');
    }
  }
  // hash marks every yard
  g.fillStyle = C.hash;
  for (let p = Math.floor(botP / PXY); p * PXY <= topP; p++){
    const y0 = Math.round(PLAYER_Y - (p * PXY - d));
    g.fillRect(56, y0, 3, 1); g.fillRect(W - 59, y0, 3, 1);
    g.fillRect(6, y0, 2, 1); g.fillRect(W - 8, y0, 2, 1);
  }
  // end zones: 10 yards after every 100-yard mark
  const ez = 100 * PXY;
  for (let k = Math.floor(botP / ez); k * ez <= topP; k++){
    if (k <= 0) continue;
    const yBottom = Math.round(PLAYER_Y - (k * ez - d));
    const hgt = 10 * PXY, yTop = yBottom - hgt;
    g.fillStyle = C.navy; g.fillRect(0, yTop, W, hgt);
    // checker pixel pattern
    g.fillStyle = C.royal;
    for (let yy = 0; yy < hgt; yy += 4) for (let xx = ((yy/4)&1)*4; xx < W; xx += 8) g.fillRect(xx, yTop + yy, 4, 4);
    g.fillStyle = C.navy; g.fillRect(14, yTop + 20, W - 28, 21);
    drawText('BEAR', W/2, yTop + 23, C.white, 3, 'center', C.black);
    g.fillStyle = C.line; g.fillRect(0, yBottom - 1, W, 2);
  }
  // sidelines
  g.fillStyle = C.line; g.fillRect(4, 0, 2, H); g.fillRect(W - 6, 0, 2, H);
  g.fillStyle = C.navy; g.fillRect(0, 0, 4, H); g.fillRect(W - 4, 0, 4, H);
}

function drawPlayer(){
  const x = Math.round(player.x), y = PLAYER_Y;
  if (state === 'tackled' || state === 'over'){
    // knocked down: draw sideways-ish (rotated 90deg) with stars
    g.save(); g.translate(x + 7, y + 7); g.rotate(Math.PI / 2); g.drawImage(S.pA, -5, -7); g.restore();
    const t = (state === 'over' ? overT : tackleT) * 6;
    g.fillStyle = C.gold;
    for (let i=0;i<3;i++){ const a = t + i * 2.09; g.fillRect(Math.round(x + 5 + Math.cos(a) * 9), Math.round(y - 2 + Math.sin(a) * 3), 2, 2); }
    return;
  }
  const frame = Math.floor(player.anim / 7) & 1;
  if (player.jukeT > 0){
    // spin: afterimages + flip frames
    const ph = Math.floor(player.jukeT * 30);
    g.globalAlpha = 0.5; g.drawImage(S.pGhost, x - 4, y + 3); g.drawImage(S.pGhost, x + 4, y + 3); g.globalAlpha = 1;
    g.drawImage(ph % 4 < 2 ? S.pA : S.pWhite, ph & 1 ? x - 1 : x + 1, y);
    return;
  }
  if (player.grace > 0 && Math.floor(player.grace * 16) & 1) return;
  const spr = frame ? (player.flip ? S.pBf : S.pB) : (player.flip ? S.pAf : S.pA);
  g.drawImage(spr, x, y);
}

function drawHUD(){
  g.fillStyle = C.dark; g.fillRect(0, 0, W, 15);
  g.fillStyle = C.royal; g.fillRect(0, 15, W, 1);
  drawText('YDS ' + yards(), 4, 5, C.white, 1);
  drawText(String(score()).padStart(6, '0'), W/2 + 6, 5, C.gold, 1, 'center');
  // juke meter
  const ready = player.jukeCD <= 0;
  g.fillStyle = C.grey; g.fillRect(W - 58, 6, 26, 4);
  g.fillStyle = ready ? C.sky : C.royal; g.fillRect(W - 58, 6, Math.round(26 * (1 - player.jukeCD / 1.3)), 4);
  drawMute();
}
const NOTE_SPR = ["..KK.","..K.K","..K..","..K..","KKK..","KKK..",".K..."];
function drawMute(){
  // music note (left) and speaker (right); red slashes show what's off
  g.fillStyle = C.white;
  NOTE_SPR.forEach((r, j) => { for (let i = 0; i < 5; i++) if (r[i] === 'K') g.fillRect(W - 26 + i, 4 + j, 1, 1); });
  if (!musicOn()){ g.fillStyle = C.red; for (let i = 0; i < 7; i++) g.fillRect(W - 27 + i, 10 - i, 1, 1); }
  g.drawImage(S.spk, W - 14, 4);
  if (!sfxOn()){ g.fillStyle = C.red; for (let i=0;i<5;i++){ g.fillRect(W - 9 + i, 5 + i, 1, 1); g.fillRect(W - 5 - i, 5 + i, 1, 1); } }
  else { g.fillStyle = C.white; g.fillRect(W - 8, 6, 1, 3); g.fillRect(W - 6, 5, 1, 5); }
  if (soundToast > 0){
    const label = ['SOUND ON', 'MUSIC OFF', 'ALL MUTED'][soundMode];
    const tw = textWidth(label, 1) + 6;
    g.fillStyle = C.black; g.fillRect(W - 4 - tw, 17, tw, 9);
    drawText(label, W - 7, 19, soundMode === 2 ? C.red : C.white, 1, 'right');

function drawButton(label, t){
  const BY = BTN.y + MY();
  const bob = Math.floor(t * 3) & 1;
  g.fillStyle = C.black; g.fillRect(BTN.x + 2, BY + 2, BTN.w, BTN.h);
  g.fillStyle = C.white; g.fillRect(BTN.x, BY - bob, BTN.w, BTN.h);
  g.fillStyle = C.royal; g.fillRect(BTN.x + 2, BY + 2 - bob, BTN.w - 4, BTN.h - 4);
  drawText(label, W/2, BY + 8 - bob, C.white, 2, 'center', C.navy);
}

function render(t){
  const sx = shake > 0 ? Math.round((Math.random() * 2 - 1) * shake) : 0;
  const sy = shake > 0 ? Math.round((Math.random() * 2 - 1) * shake) : 0;
  g.save(); g.translate(sx, sy);
  const fd = state === 'title' ? titleScroll : dist;
  drawField(fd);

  if (state !== 'title'){
    for (const b of balls){
      const by = Math.round(b.y + (Math.floor(b.t * 4) & 1));
      g.drawImage(S.ball, Math.round(b.x), by);
      if (Math.floor(b.t * 5) % 3 === 0){ g.fillStyle = C.white; g.fillRect(Math.round(b.x) + 7, by - 2, 1, 1); }
    }
    for (const d of defenders){
      const f = Math.floor(d.anim) & 1;
      const spr = d.tracker ? (f ? S.tB : S.tA) : (f ? S.dB : S.dA);
      if (d.passed) g.globalAlpha = 0.45;
      g.drawImage(spr, Math.round(d.x), Math.round(d.y));
      g.globalAlpha = 1;
    }
    drawPlayer();
  }
  for (const p of particles){ g.fillStyle = p.col; g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz); }
  for (const p of popups) drawText(p.txt, p.x, Math.round(p.y), p.col, 1, 'center', C.black);
  g.restore();

  if (flash > 0){ g.fillStyle = (Math.floor(flash * 20) & 1) ? C.white : C.royal; g.globalAlpha = Math.min(0.7, flash * 1.6); g.fillRect(0, 0, W, H); g.globalAlpha = 1; }

  if (state === 'play' || state === 'tackled'){
    drawHUD();
    if (tdText > 0){
      const col = (Math.floor(tdText * 10) & 1) ? C.gold : C.white;
      const ty = Math.floor(H * 0.32); g.fillStyle = C.navy; g.fillRect(0, ty, W, 30);
      g.fillStyle = C.white; g.fillRect(0, ty, W, 1); g.fillRect(0, ty + 29, W, 1);
      drawText('TOUCHDOWN!', W/2, ty + 6, col, 2, 'center', C.black);
      drawText('TD ' + tds + '  +700', W/2, ty + 21, C.sky, 1, 'center');
    }
    if (state === 'play' && elapsed < 2.2 && tds === 0){
      drawText('HIKE!', W/2, Math.floor(H * 0.4), C.white, 3, 'center', C.navy);
    }
  } else if (state === 'title'){
    drawTitle(t);
  } else if (state === 'over'){
    drawOver(t);
  }
}

function panel(x, y, w, h){
  g.fillStyle = C.black; g.fillRect(x + 3, y + 3, w, h);
  g.fillStyle = C.white; g.fillRect(x, y, w, h);
  g.fillStyle = C.navy; g.fillRect(x + 2, y + 2, w - 4, h - 4);
}

function drawTitle(t){
  g.fillStyle = 'rgba(0,26,54,0.55)'; g.fillRect(0, 0, W, H);
  const my = MY(); g.save(); g.translate(0, my);
  panel(14, 26, W - 28, 66);
  const bounce = Math.round(Math.sin(t * 3) * 2);
  drawText('BEAR', W/2, 36 + bounce, C.white, 7, 'center', C.royal);
  g.drawImage(S.paw, 20, 76); g.drawImage(S.paw, W - 27, 76);
  drawText('BLUE & WHITE FOOTBALL', W/2, 80, C.sky, 1, 'center');

  panel(10, 104, W - 20, 80);
  const lines = [['DRAG / ARROWS', 'RUN L-R', C.white], ['TAP / SPACE', 'SPIN JUKE', C.white],
                 ['FOOTBALL', '+50 & BURST', C.gold], ['100 YARDS', 'TOUCHDOWN!', C.gold], ['RED HELMETS', 'RUSH', C.red], ['GOLD HELMETS', 'CHASE YOU', C.gold]];
  lines.forEach((l, i) => { drawText(l[0], 16, 112 + i * 11, C.sky, 1, 'left'); drawText(l[1], W - 16, 112 + i * 11, l[2], 1, 'right'); });

  drawText('BEST ' + best, W/2, 236, C.gold, 1, 'center', C.black);
  // mini running back
  g.drawImage((Math.floor(t * 8) & 1) ? S.pA : S.pB, W/2 - 5, 250);
  drawText('M: MUSIC / SOUND', W/2, 274, C.white, 1, 'center', C.black);
  g.restore();
  drawButton('PLAY', t);
  drawMute();
}

function drawOver(t){
  g.fillStyle = 'rgba(0,10,25,0.6)'; g.fillRect(0, 0, W, H);
  g.save(); g.translate(0, MY());
  panel(14, 36, W - 28, 140);
  drawText('TACKLED!', W/2, 48, C.red, 3, 'center', C.black);
  drawText('SCORE', W/2, 78, C.sky, 1, 'center');
  drawText(String(score()), W/2, 88, C.white, 3, 'center', C.black);
  drawText('YARDS ' + yards() + '   TDS ' + tds, W/2, 114, C.white, 1, 'center');
  drawText('BEST ' + best, W/2, 128, C.gold, 2, 'center', C.black);
  if (newBest && (Math.floor(t * 4) & 1)) drawText('NEW BEST!', W/2, 150, C.gold, 2, 'center', C.red);
  g.restore();
  if (overT > 0.6) drawButton('PLAY AGAIN', t);
  drawMute();
}

function present(){
  sctx.imageSmoothingEnabled = false;
  sctx.fillStyle = '#001a36'; sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.drawImage(buf, 0, 0, W, H, offX, offY, Math.round(W * scale), Math.round(H * scale));
}

let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 1/20) dt = 1/20; if (dt < 0) dt = 0;
  update(dt);
  render(now / 1000);
  present();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
